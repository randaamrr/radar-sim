# Same room as room_basic.yaml with an explicit radar_config:
# one section for all radars, and an override for radar_east.
seed: 42
fps: 20
room:
  size_m: [4.0, 3.0, 2.7]
  grid_step_m: 0.1
surfaces:
  walls: concrete
  floor: concrete
  ceiling: concrete
furniture:
  - name: bed
    pos_m: [0.1, 0.1]
    size_m: [2.0, 1.4, 0.5]
    material: wood
  - name: wardrobe
    pos_m: [3.4, 0.1]
    size_m: [0.5, 1.2, 2.0]
    material: wood
  - name: table
    pos_m: [2.0, 2.0]
    size_m: [1.0, 0.6, 0.75]
    material: wood
radar_config:
  preset: baseline_1ghz
  n_chirps: 128
radars:
  - name: radar_west
    pos_m: [0.0, 1.5, 2.2]
    yaw_deg: 0
    pitch_deg: -20
  - name: radar_east
    pos_m: [4.0, 1.5, 2.2]
    yaw_deg: 180
    pitch_deg: -20
    radar_config: {preset: wide_4ghz, n_chirps: 64}
